global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    # Los tuneles CONNECT necesitan un plazo generoso
    timeout tunnel  1h

frontend fe_proxy
    bind *:8080
    default_backend be_proxy

backend be_proxy
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server proxya proxy-a:8080 check inter 1s fall 2 rise 1
    server proxyb proxy-b:8080 check inter 1s fall 2 rise 1

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
